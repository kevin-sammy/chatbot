name: Verify chatbot and refresh official knowledge
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
concurrency:
  group: chatbot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: node scripts/check-knowledge.mjs
      - run: node scripts/evaluate.mjs
      - run: npm run build
  refresh:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Refresh official website knowledge
        id: crawl
        run: |
          set +e
          python3 -u scripts/ingest.py
          refresh_status=$?
          set -e
          case "$refresh_status" in
            0) echo 'refreshed=true' >> "$GITHUB_OUTPUT" ;;
            75) echo 'refreshed=false' >> "$GITHUB_OUTPUT" ;;
            *) exit "$refresh_status" ;;
          esac
      - run: node scripts/check-knowledge.mjs
      - run: node --test tests/*.test.mjs
      - run: node scripts/evaluate.mjs
      - run: npm run build
      - name: Publish validated data for the Vercel Git integration
        if: steps.crawl.outputs.refreshed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json data/tenants.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh validated official Galleria knowledge'
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push origin HEAD:main
